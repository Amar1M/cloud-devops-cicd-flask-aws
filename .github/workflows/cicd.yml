name: CI/CD Pipeline - Flask to AWS EC2

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  DOCKER_IMAGE: amardevops/flask-devops-app
  # Change amardevops to your Docker Hub username

jobs:
  # JOB 1: Test and Build
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          # Run pytest if tests exist, else skip
          if [ -d "tests" ]; then
            pytest tests/ -v || echo "Tests failed or no tests"
          else
            echo "No tests directory - skipping"
          fi

      - name: Lint with flake8 (optional)
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || echo "Lint warnings"

  # JOB 2: Build and Push Docker Image + Deploy to EC2
  build-and-deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ github.sha }}
            BUILD_NUMBER=${{ github.run_number }}

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "=== Starting deployment on EC2 ==="
            echo "Build: ${{ github.run_number }} Commit: ${{ github.sha }}"
            
            # Pull latest image
            docker pull ${{ env.DOCKER_IMAGE }}:latest
            
            # Stop and remove old container if exists
            docker stop flask-devops-app || true
            docker rm flask-devops-app || true
            
            # Run new container
            docker run -d \
              --name flask-devops-app \
              --restart unless-stopped \
              -p 80:5000 \
              -e APP_VERSION=${{ github.sha }} \
              -e BUILD_NUMBER=${{ github.run_number }} \
              -e GIT_COMMIT=${{ github.sha }} \
              -e ENVIRONMENT=production \
              -e AWS_REGION=ap-south-1 \
              ${{ env.DOCKER_IMAGE }}:latest
            
            # Wait for health check
            echo "Waiting for app to be healthy..."
            sleep 10
            curl -f http://localhost:5000/health || echo "Health check failed, checking logs..."
            docker logs flask-devops-app --tail 20
            
            # Cleanup old images
            docker image prune -f
            
            echo "=== Deployment completed successfully ==="
            echo "App should be live at http://${{ secrets.EC2_HOST }}"

      - name: Verify deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "=== Verifying deployment ==="
            docker ps | grep flask-devops-app
            curl -s http://localhost:5000/health | head -20
            echo "Deployment verification done"
