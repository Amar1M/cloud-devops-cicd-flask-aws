name: CI/CD Pipeline - Flask to AWS EC2 (Simplified)

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          if [ -d "tests" ]; then
            pytest tests/ -v || echo "Tests completed"
          else
            echo "No tests"
          fi

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "=== Starting deployment on EC2 ==="
            echo "Build: ${{ github.run_number }} Commit: ${{ github.sha }}"
            
            # Navigate to project or clone if not exists
            if [ -d "cloud-devops-cicd-flask-aws" ]; then
              cd cloud-devops-cicd-flask-aws
              git pull origin main
            else
              git clone https://github.com/Amar1M/cloud-devops-cicd-flask-aws.git
              cd cloud-devops-cicd-flask-aws
            fi
            
            # Build Docker image on EC2
            docker build -t flask-devops-app:latest .
            
            # Stop and remove old container
            docker stop flask-app || true
            docker rm flask-app || true
            
            # Run new container
            docker run -d \
              --name flask-app \
              --restart unless-stopped \
              -p 80:5000 \
              -e APP_VERSION=${{ github.sha }} \
              -e BUILD_NUMBER=${{ github.run_number }} \
              -e GIT_COMMIT=${{ github.sha }} \
              -e ENVIRONMENT=production \
              flask-devops-app:latest
            
            # Wait and check health
            echo "Waiting for app to be healthy..."
            sleep 10
            curl -f http://localhost/health || echo "Health check - checking logs..."
            docker logs flask-app --tail 20
            docker ps
            
            # Cleanup old images
            docker image prune -f
            
            echo "=== Deployment completed ==="
            echo "App live at http://${{ secrets.EC2_HOST }}"
